# nginx proxy address - http://172.17.0.1:3002

name: forgejo
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:latest
    pull_policy: always
    container_name: forgejo-app
    restart: always
    logging: *default-logging
    networks:
      - forgejo
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:3002:3000"
      - "172.17.0.1:2222:22"
    environment:
      TZ: ${TZ:-America/New_York}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: ${DB_CREATE_DATABASE_NAME:-forgejo}
      FORGEJO__database__USER: ${DB_USER_NAME:-forgejo}
      FORGEJO__database__PASSWD: ${DB_USER_PASS:-changeme_db_password}
      FORGEJO__server__DOMAIN: ${BASE_HOST_NAME:-localhost}
      FORGEJO__server__ROOT_URL: http://${BASE_HOST_NAME:-localhost}:3002/
      FORGEJO__server__SSH_DOMAIN: ${BASE_HOST_NAME:-localhost}
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__security__SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      CONTAINER_NAME: forgejo-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/data/forgejo:/data
    depends_on:
      - forgejo-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://forgejo-app:3000'
      - 'cloudflare.hostname=forgejo.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.forgejo-app.entrypoints=http'
      - 'traefik.http.routers.forgejo-app-secure.tls=true'
      - 'traefik.http.routers.forgejo-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.forgejo-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.forgejo-app.middlewares=forgejo-app-https-redirect'
      - 'traefik.http.routers.forgejo-app-secure.entrypoints=https'
      - 'traefik.http.routers.forgejo-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.forgejo-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.forgejo-app-secure.service=forgejo-app'
      - 'traefik.http.services.forgejo-app.loadbalancer.server.port=3000'

  forgejo-db:
    image: postgres:latest
    pull_policy: always
    container_name: forgejo-db
    restart: always
    logging: *default-logging
    networks:
      - forgejo
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-forgejo}
      POSTGRES_USER: ${DB_USER_NAME:-forgejo}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: forgejo-db
    volumes:
      - ./volumes/data/db/postgres/forgejo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  forgejo:
    name: forgejo
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
